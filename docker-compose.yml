services:
  db:
    image: postgres:16-alpine
    container_name: zemen-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zemen_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d zemen_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  alembic:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: zemen-alembic
    entrypoint: [ "alembic", "-c", "/opt/app/app/persistence/sqlalchemy/alembic.ini" ]
    env_file:
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEVELOPMENT_DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/zemen_db
      - STAGING_DATABASE_URL=${STAGING_DATABASE_URL:-}
      - PRODUCTION_DATABASE_URL=${PRODUCTION_DATABASE_URL:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/opt/app
      - /opt/app/.venv
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: zemen-backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEVELOPMENT_DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/zemen_db
      - STAGING_DATABASE_URL=${STAGING_DATABASE_URL:-}
      - PRODUCTION_DATABASE_URL=${PRODUCTION_DATABASE_URL:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/opt/app
      - /opt/app/.venv
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
