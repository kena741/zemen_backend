[project]
name = "zemen-backend"
version = "0.1.0"
description = "Zemen Service dedicated FastAPI backend (Supabase-compatible)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "pydantic-settings",
    "asyncpg",
    "python-dotenv",
    "pyjwt[crypto]>=2.13.0",
    "httpx>=0.28.1",
    "email-validator>=2.3.0",
    "greenlet>=3.5.5",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
